# external-lock.yaml — pinned dependencies (INV-14)

# Production never follows `main` / `latest` / `HEAD`.
# Exact versions of every Python runtime dependency are pinned by `uv.lock`
# (reproducible resolution, verified by `uv lock --check` and `uv sync --locked` in CI).
# Key pins as of 2026-08-26:
#   pydantic 2.13.4, pydantic-settings 2.15.0, fastapi 0.141.1, uvicorn 0.52.4
#   (dev) pytest 8.4.2, mypy 1.20.2, ruff 0.16.4, httpx 0.28.1

python_runtime:
  pin_authority: uv.lock
  core_runtime_python: "3.12"
  quant_rd_python: "3.11"

# Docker infrastructure images (infra/compose) — exact pins, never `latest`.
# Reviewed 2026-08-26 against Docker Hub / GHCR / upstream compose manifests.
infrastructure_images:
  - service: postgres
    image: timescale/timescaledb:2.29.2-pg16
    role: transactional source of truth (ADR-0010)
  - service: redis
    image: redis:7.4-alpine
    role: cache, locks, streams
  - service: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    role: S3-compatible object store
  - service: minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    role: one-shot bucket bootstrap
  - service: falkordb
    image: falkordb/falkordb:v4.20.4-alpine
    role: graph store (Graphiti backend, Phase 3)
  - service: clickhouse
    image: clickhouse/clickhouse-server:25.12.11
    role: Langfuse analytics backend
  - service: langfuse
    image: docker.langfuse.com/langfuse/langfuse:v4.19.0
    role: LLM observability/evaluation (§22)
  - service: langfuse-worker
    image: docker.langfuse.com/langfuse/langfuse-worker:v4.19.0
    role: Langfuse async worker
  - service: mlflow
    image: ghcr.io/mlflow/mlflow:v3.8.1
    role: experiment tracking (custom image adds psycopg2-binary 2.9.12, boto3 1.43.80)
  - service: prometheus
    image: prom/prometheus:v3.14.0
    role: metrics collection (§23)
  - service: grafana
    image: grafana/grafana:13.0.7
    role: dashboards (§23)
  - service: postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.20.1
    role: postgres metrics
  - service: redis-exporter
    image: oliver006/redis_exporter:v1.89.0-alpine
    role: redis metrics

# Upstream trading projects — status: NOT INTEGRATED in Phase 0.
