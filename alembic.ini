# Alembic configuration for OpenTrading (repo-root migrations).
# The target DSN is injected by migrations/env.py from settings
# (`OT_POSTGRES_DSN`, dev default matches infra/compose/docker-compose.yml).

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is set at runtime in migrations/env.py — leave empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
